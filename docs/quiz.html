<style>
:root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --blue:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#131c2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#253349; } }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
.wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
a { color:var(--blue); } h1 { font-size:1.9rem; }
.sub { color:var(--muted); }
.scorebox { position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
.score { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; font-weight:700; }
.qcard { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:14px; padding:18px 20px; margin-top:16px; }
.qcard h3 { font-size:1.02rem; margin-bottom:10px; }
.opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
.opt:hover { border-color:var(--accent); }
.opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--bg)); }
.opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.why { display:none; margin-top:10px; color:var(--muted); font-size:.92rem; border-top:1px dashed var(--line); padding-top:8px; }
.reset { margin-top:20px; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
footer { margin-top:44px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:.88rem; }
</style>

<style id="i18n-css">
#lang-pick{position:fixed;top:10px;right:10px;z-index:9999;font:600 .85rem -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--card,#fff);color:var(--ink,#0f172a);border:1px solid var(--line,#e2e8f0);border-radius:999px;padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}
html[lang="mr"] body{font-family:"Noto Sans Devanagari","Mukta","Devanagari Sangam MN","Nirmala UI",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
html[lang="mr"] svg text{font-family:"Noto Sans Devanagari","Mukta","Devanagari Sangam MN","Nirmala UI",sans-serif}
@media print{#lang-pick{display:none}}
</style></head><body><select aria-label="Language / भाषा" id="lang-pick" onchange="schoolSetLang(this.value)">

<p data-en='&lt;a href="index.html"&gt;← Back to the course home&lt;/a&gt;'><a href="index.html">← कोर्सच्या मुख्य पानाकडे परत</a></p>
<h1 data-en="🧪 The 🪪 AWS — IAM &amp;amp; EC2 quiz">🧪 🪪 AWS — IAM &amp; EC2 प्रश्नमंजुषा</h1>
<p class="sub" data-en="15 questions — pick an answer, get the why. One attempt per question (until reset).
Your best score is saved in this browser.">15 प्रश्न — उत्तर निवडा, कारण मिळवा. प्रत्येक प्रश्नाला एकच प्रयत्न (reset पर्यंत). तुमचा सर्वोत्तम गुण या ब्राउझरमध्ये जपला जातो.</p>
<div class="scorebox"><div class="score" data-en="0 / 15 · best: —" id="score">0 / 15 · सर्वोत्तम: —</div></div>
<div id="quiz"></div>
<button class="reset" data-en="↺ Reset &amp;amp; retake" onclick="reset()">↺ Reset &amp; पुन्हा द्या</button>
<footer data-en='Part of &lt;a href="https://baluraut.github.io/school/"&gt;🏫 The School&lt;/a&gt; · &lt;a href="index.html"&gt;course home&lt;/a&gt; ·

'><a href="https://baluraut.github.io/school/">🏫 द स्कूल</a> चा भाग · <a href="index.html">कोर्स मुख्य पान</a> · <a href="https://github.com/BaluRaut/learn-aws-school/issues">🐛 चूक सापडली?</a></footer>
</div>
<script>
var QS = [{"q": "Correct daily use of the root account?", "o": ["Admin tasks", "Basically never — MFA it and lock it away", "CI pipelines"], "c": 1, "w": "L01: the master key lives in the safe; daily work uses IAM identities."}, {"q": "No policy mentions an action. Result?", "o": ["Allowed", "Denied — default is NO", "Asks for confirmation"], "c": 1, "w": "L03: silence means no; slips open doors explicitly."}, {"q": "An Allow and an explicit Deny both match. Who wins?", "o": ["Allow", "Deny — always", "Most recent one"], "c": 1, "w": "L03: Deny slams doors no Allow can reopen — how 'everything EXCEPT the safe' is written."}, {"q": "Role vs user, in one line?", "o": ["Roles are for admins", "A wearable identity with TEMPORARY credentials vs a permanent person", "Same thing"], "c": 1, "w": "L04: hats, not people — assumed for ~1h, audit shows person AND hat."}, {"q": "How does code on EC2 get AWS permissions, done right?", "o": ["Access keys in a config file", "An instance-profile role via the metadata service — no keys anywhere", "Root credentials"], "c": 1, "w": "L05/L12: the badge slot at 169.254.169.254 hands out fresh temporary creds."}, {"q": "A security group's default inbound stance?", "o": ["Allow all", "Deny (silence) — you open doors explicitly", "Allow same-VPC only"], "c": 1, "w": "L10: not on the guest list = the desk never hears the knock."}, {"q": "Stop vs terminate an instance?", "o": ["Identical", "Stop keeps the EBS drawer (pennies); terminate hands everything back", "Terminate keeps backups automatically"], "c": 1, "w": "L07/L11: know which one you're typing before you type it."}, {"q": "Spot instances are…", "o": ["Broken instances", "~90% off standby seats reclaimable with a 2-minute warning", "Free tier"], "c": 1, "w": "L08: a superpower for interruptible work — and k8s pods can always move desks."}, {"q": "What makes a subnet “public”?", "o": ["Its name contains “public”", "Its route table points 0.0.0.0/0 at the internet gateway", "AWS picks one per AZ"], "c": 1, "w": "L13: the corridor sign pointing at the gate is the whole trick (plus a public IP on the instance)."}, {"q": "Let a stranger download ONE private S3 file, safely?", "o": ["Make the bucket public", "Hand them a presigned URL that expires", "Email them access keys"], "c": 1, "w": "L14: the visitor pass — anyone holding it gets in, until it expires."}, {"q": "A desk keeps failing the ALB health check. What happens?", "o": ["It gets restarted", "Reception skips it — no traffic, no restart", "The ALB pages you first"], "c": 1, "w": "L15: that's readiness, not liveness — reception just stops sending visitors its way."}, {"q": "Your “empty” account bills $40/month. Prime suspect?", "o": ["S3 storage", "A forgotten NAT gateway (then: idle ALB/RDS, orphan EBS)", "IAM users"], "c": 1, "w": "L13/L20: the postbox costs ~$32/month just for existing — the classic surprise."}, {"q": "NACL vs security group — the one-line difference?", "o": ["Same thing, two consoles", "NACL: subnet, stateless, allow+deny · SG: instance, stateful, allow-only", "NACLs are for IPv6 only"], "c": 1, "w": "L21: hallway rules at the wing door vs the guest list at the desk — debug order: sign → NACL → SG."}, {"q": "Why one NAT gateway per AZ?", "o": ["AWS requires it", "A shared NAT is a single point of failure AND adds cross-AZ data charges", "NATs can't route across subnets"], "c": 1, "w": "L22: building A burns → desks in B pointed at A's postbox go mute; and every GB crossed a building line."}, {"q": "You add a WAF managed rule group today. First setting?", "o": ["Block, obviously", "Count mode — read the logs for a day, then block", "Rate limit at 10 requests"], "c": 1, "w": "L24: bouncers who block on day one throw out the principal — count first, tune, then flip."}];
var KEY='quiz-aws-school', answered={}, score=0;
var best = parseInt(localStorage.getItem(KEY)||'-1');
function render() {
  var el = document.getElementById('quiz'); el.innerHTML='';
  QS.forEach(function(q,i) {
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<h3>'+(i+1)+'. '+q.q+'</h3>';
    q.o.forEach(function(opt,j) {
      var b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=function() {
        if (answered[i]!==undefined) return;
        answered[i]=j;
        if (j===q.c) { b.classList.add('right'); score++; }
        else { b.classList.add('wrong'); card.querySelectorAll('.opt')[q.c].classList.add('right'); }
        card.querySelector('.why').style.display='block';
        update();
      };
      card.appendChild(b);
    });
    var why=document.createElement('div'); why.className='why'; why.textContent='💡 '+q.w;
    card.appendChild(why);
    el.appendChild(card);
  });
}
function update() {
  var done=Object.keys(answered).length;
  if (done===QS.length && score>best) { best=score; localStorage.setItem(KEY,best); }
  document.getElementById('score').textContent=score+' / '+QS.length+(done===QS.length?' — done! 🎓':'')+' · best: '+(best<0?'—':best+'/'+QS.length);
}
function reset() { answered={}; score=0; render(); update(); }
render(); update();
</script>

<script id="i18n-js">
function schoolSetLang(l){
  try{localStorage.setItem('school-lang',l)}catch(e){}
  document.documentElement.setAttribute('lang',l);
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(!el.hasAttribute('data-mr')) el.setAttribute('data-mr', el.innerHTML);
    el.innerHTML = (l==='en') ? el.getAttribute('data-en') : el.getAttribute('data-mr');
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    if(!el.hasAttribute('data-mr-ph')) el.setAttribute('data-mr-ph', el.getAttribute('placeholder'));
    el.setAttribute('placeholder', (l==='en') ? el.getAttribute('data-en-ph') : el.getAttribute('data-mr-ph'));
  });
  var p=document.getElementById('lang-pick'); if(p) p.value=l;
}
(function(){ var l='mr'; try{ l=localStorage.getItem('school-lang')||'mr'; }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){schoolSetLang(l)}); else schoolSetLang(l); })();
</script></body></html>
